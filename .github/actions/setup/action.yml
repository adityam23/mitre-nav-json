name: Set up mitre-navigator
description: Install uv, the pinned Python version and the locked project dependencies.

inputs:
  cache-stix:
    description: Persist downloaded ATT&CK STIX bundles between workflow runs.
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install project
      shell: bash
      run: uv sync --locked

    # Bundles are immutable and hash-verified per release, so a stale cache is only ever missing files.
    - name: Point the STIX cache at a persisted directory
      if: inputs.cache-stix == 'true'
      shell: bash
      run: echo "MITRE_NAVIGATOR_CACHE_DIR=${{ runner.temp }}/mitre-stix" >> "$GITHUB_ENV"

    - name: Restore STIX cache
      if: inputs.cache-stix == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/mitre-stix
        # Cache entries are immutable, so key on the requests too: a newly requested release is then saved.
        key: mitre-stix-${{ hashFiles('uv.lock', 'mitre_input/**') }}
        restore-keys: mitre-stix-
