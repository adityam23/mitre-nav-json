name: Generate MITRE Navigator layers

on:
  push:
    branches: [main]
    # Code and dependency changes can change every layer (e.g. a new "latest" ATT&CK release).
    paths:
      - "mitre_input/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/mitre-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mitre-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-stix: "true"

      # Rebuilds every request so mitre_output/ always matches mitre_input/, including requests that failed
      # in earlier runs. Failed requests keep their last good layer; the job is failed after committing.
      - name: Sync layers with requests
        id: sync
        continue-on-error: true
        run: uv run mitre-navigator sync

      # Commits made with GITHUB_TOKEN do not trigger further workflow runs, so this cannot loop.
      - name: Commit generated layers
        run: |
          git add mitre_output
          if git diff --cached --quiet; then
            echo "No layer changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate ATT&CK Navigator layers for ${GITHUB_SHA::7}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Fail if any request failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Some requests failed (see 'Sync layers with requests'); their previous layers were kept."
          exit 1
