name: Validate MITRE requests

on:
  pull_request:
    # Same inputs as the generate workflow, so a green PR means generation on main will succeed.
    paths:
      - "mitre_input/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/mitre-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-stix: "true"

      - name: Validate every request
        run: uv run mitre-navigator validate
